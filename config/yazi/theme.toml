# Yazi Theme - Event Horizon (Horizon Dark)

[manager]
cwd = { fg = "#26bbd9", bold = true }
hovered = { fg = "#1c1e26", bg = "#26bbd9", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#ee64ac", bold = true, italic = true }
find_position = { fg = "#59e3e3", bg = "reset", bold = true, italic = true }
marker_copied = { fg = "#29d398", bg = "#29d398" }
marker_cut = { fg = "#e95678", bg = "#e95678" }
marker_selected = { fg = "#ee64ac", bg = "#ee64ac" }
tab_active = { fg = "#1c1e26", bg = "#26bbd9", bold = true }
tab_inactive = { fg = "#fadad1", bg = "#232530" }
tab_width = 1
count_copied = { fg = "#1c1e26", bg = "#29d398" }
count_cut = { fg = "#1c1e26", bg = "#e95678" }
count_selected = { fg = "#1c1e26", bg = "#ee64ac" }
border_symbol = "│"
border_style = { fg = "#6c6f93" }

[status]
separator_open = ""
separator_close = ""
separator_style = { fg = "#232530", bg = "#232530" }

mode_normal = { fg = "#1c1e26", bg = "#26bbd9", bold = true }
mode_select = { fg = "#1c1e26", bg = "#ee64ac", bold = true }
mode_unset = { fg = "#1c1e26", bg = "#e95678", bold = true }

progress_label = { fg = "#fadad1", bold = true }
progress_normal = { fg = "#6c6f93", bg = "#232530" }
progress_error = { fg = "#e95678", bg = "#232530" }

permissions_t = { fg = "#59e3e3" }
permissions_r = { fg = "#ee64ac" }
permissions_w = { fg = "#e95678" }
permissions_x = { fg = "#29d398" }
permissions_s = { fg = "#6c6f93" }

[select]
border = { fg = "#26bbd9" }
active = { fg = "#26bbd9", bold = true }
inactive = { fg = "#fadad1" }

[input]
border = { fg = "#26bbd9" }
title = { fg = "#ee64ac" }
value = { fg = "#fadad1" }
selected = { reversed = true }

[completion]
border = { fg = "#6c6f93" }
active = { fg = "#1c1e26", bg = "#26bbd9" }
inactive = { fg = "#fadad1" }

[tasks]
border = { fg = "#6c6f93" }
title = { fg = "#ee64ac" }
hovered = { fg = "#26bbd9", underline = true }

[which]
cols = 3
mask = { bg = "#232530" }
cand = { fg = "#59e3e3" }
rest = { fg = "#6c6f93" }
desc = { fg = "#fadad1" }
separator = "  "
separator_style = { fg = "#6c6f93" }

[help]
on = { fg = "#59e3e3" }
run = { fg = "#ee64ac" }
desc = { fg = "#fadad1" }
hovered = { reversed = true, bold = true }
footer = { fg = "#6c6f93", bg = "#232530" }

[notify]
title_info = { fg = "#26bbd9" }
title_warn = { fg = "#ee64ac" }
title_error = { fg = "#e95678" }

[filetype]
rules = [
    # Directories
    { name = "*/", fg = "#26bbd9", bold = true },

    # Media
    { mime = "image/*", fg = "#f075b5" },
    { mime = "video/*", fg = "#59e3e3" },
    { mime = "audio/*", fg = "#ee64ac" },

    # Archives
    { mime = "application/zip", fg = "#ee64ac" },
    { mime = "application/gzip", fg = "#ee64ac" },
    { mime = "application/x-tar", fg = "#ee64ac" },
    { mime = "application/x-rar", fg = "#ee64ac" },
    { mime = "application/x-7z-compressed", fg = "#ee64ac" },

    # Documents
    { mime = "application/pdf", fg = "#e95678" },
    { mime = "application/doc", fg = "#26bbd9" },
    { mime = "text/*", fg = "#29d398" },

    # Executables
    { mime = "application/x-executable", fg = "#29d398" },
    { name = "*.sh", fg = "#29d398" },

    # Config files
    { name = "*.toml", fg = "#ee64ac" },
    { name = "*.yaml", fg = "#ee64ac" },
    { name = "*.yml", fg = "#ee64ac" },
    { name = "*.json", fg = "#ee64ac" },
    { name = "*.nix", fg = "#59e3e3" },
    { name = "*.kdl", fg = "#59e3e3" },

    # Git
    { name = ".git*", fg = "#ee64ac" },

    # Default
    { name = "*", fg = "#fadad1" },
]
