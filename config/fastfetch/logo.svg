<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Accretion disk gradient: pink at top, cyan at bottom (doppler-like asymmetry) -->
    <linearGradient id="diskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ee64ac" stop-opacity="1.0"/>
      <stop offset="45%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#26bbd9" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Inner glow around the event horizon -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1c1e26" stop-opacity="1"/>
      <stop offset="60%" stop-color="#1c1e26" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ee64ac" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ee64ac" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer halo fading into space -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#26bbd9" stop-opacity="0"/>
      <stop offset="85%" stop-color="#26bbd9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#26bbd9" stop-opacity="0"/>
    </radialGradient>

    <!-- Tilt transform: accretion disk viewed at ~65° -->
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Outer halo ring -->
  <circle cx="256" cy="256" r="240" fill="url(#halo)"/>

  <!-- Outer accretion disk (tilted ellipse, thick ring) -->
  <g transform="translate(256 256) rotate(-15)">
    <ellipse cx="0" cy="0" rx="220" ry="70"
             fill="none" stroke="url(#diskGrad)" stroke-width="14"
             opacity="0.85" filter="url(#soften)"/>
    <ellipse cx="0" cy="0" rx="200" ry="58"
             fill="none" stroke="#ee64ac" stroke-width="3"
             opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="180" ry="48"
             fill="none" stroke="#26bbd9" stroke-width="2"
             opacity="0.5"/>
  </g>

  <!-- Photon ring: thin bright circle around the event horizon -->
  <circle cx="256" cy="256" r="96" fill="none"
          stroke="#fadad1" stroke-width="2" opacity="0.9"/>
  <circle cx="256" cy="256" r="100" fill="none"
          stroke="#ee64ac" stroke-width="3" opacity="0.7"/>
  <circle cx="256" cy="256" r="108" fill="none"
          stroke="#26bbd9" stroke-width="2" opacity="0.5"/>

  <!-- Inner shadow / event horizon -->
  <circle cx="256" cy="256" r="92" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="78" fill="#0c0e14"/>

  <!-- Tiny highlight on upper-left of disk (doppler beam) -->
  <g transform="translate(256 256) rotate(-15)">
    <ellipse cx="-150" cy="-30" rx="70" ry="12"
             fill="#ee64ac" opacity="0.55" filter="url(#soften)"/>
  </g>
</svg>
