# Kitty Panel Config — Alpine Dashboard background layer
# Used with: kitten panel --edge=background --config ~/.config/kitty/panel.conf

background #1c1e26
background_opacity 0.88
font_family JetBrainsMono Nerd Font
font_size 11
cursor_shape block
shell_integration no-cursor
scrollback_lines 0
enable_audio_bell no
cursor_blink_interval 0
