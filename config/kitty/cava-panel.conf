# Kitty Panel Config — Cava visualizer at bottom of DP-3
# Used with: kitten panel --edge=bottom --lines=8 --output-name=DP-3

background_opacity 0
font_family JetBrainsMono Nerd Font
font_size 10
scrollback_lines 0
enable_audio_bell no
cursor_blink_interval 0
shell_integration no-cursor
cursor_shape block
