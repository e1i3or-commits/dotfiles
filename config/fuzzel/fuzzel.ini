# Fuzzel Configuration - Event Horizon Theme (Horizon Dark)

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=auto
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=kitty
layer=overlay
lines=12
width=45
horizontal-pad=20
vertical-pad=12
inner-pad=8

[colors]
# Event Horizon (Horizon Dark) colors
background=1c1e26e6
text=fadad1ff
prompt=ee64acff
input=fadad1ff
match=26bbd9ff
selection=26bbd9e0
selection-text=1c1e26ff
selection-match=3fc4deff
border=26bbd9cc

[border]
width=3
radius=12

[dmenu]
exit-immediately-if-empty=no
